<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Mario ML - Nivel 2</title>
    <link rel="stylesheet" href="style.css">
    <style>
        #juego-nivel2 {
            background-color: #000;
            background-image: none;
            overflow: hidden;
            position: relative;
        }

        #escenario {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            width: 3200px; /* Ancho extendido para el scroll */
            will-change: transform;
        }

        /* Banner de texto superior dinámico */
        #texto-nivel2 {
            position: fixed;
            top: 80px;
            left: 50%;
            transform: translateX(-50%);
            color: #ffffff;
            font-size: 28px;
            text-transform: uppercase;
            letter-spacing: 2px;
            z-index: 100;
            text-align: center;
            text-shadow: 3px 3px 0px #000;
            pointer-events: none;
            width: 90%;
            max-width: 900px;
        }

        /* Elementos del nivel */
        .tuberia {
            position: absolute;
            background-image: url('https://cdn.pixabay.com/photo/2013/07/12/13/52/super-mario-brothers-147465_1280.png');
            background-size: 100% 100%;
            background-repeat: no-repeat;
            z-index: 10;
        }

        /* Planta Piraña 1 */
        #planta1 {
            position: absolute;
            width: 40px;
            height: 50px;
            left: 520px;
            bottom: 150px;
            background-image: url('https://www.pngkey.com/png/full/223-2236894_mario-piranha-plant-pixel-art.png');
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            z-index: 8; /* Detrás de la boca del tubo */
            transition: bottom 0.6s ease-in-out;
        }

        /* Planta Piraña 2 */
        #planta2 {
            position: absolute;
            width: 40px;
            height: 50px;
            left: 1220px;
            bottom: 160px;
            background-image: url('https://www.pngkey.com/png/full/223-2236894_mario-piranha-plant-pixel-art.png');
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            z-index: 8;
        }

        /* Espina / Proyectil */
        #espina {
            position: absolute;
            width: 20px;
            height: 20px;
            background: radial-gradient(circle, #ff3300 30%, #990000 80%);
            clip-path: polygon(50% 0%, 100% 100%, 0% 100%);
            z-index: 12;
            display: none;
            box-shadow: 0 0 6px #ff0000;
        }

        /* Hongo Revividor */
        #hongo {
            position: absolute;
            width: 40px;
            height: 40px;
            background-image: url('https://www.pngaaa.com/element/164813');
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            z-index: 15;
            display: none;
        }

        /* Skin Fantasma */
        #mario.mario-fantasma {
            background-image: url('https://i2.wp.com/webstockreview.net/images/mario-clipart-pixel-mario-13.png') !important;
            filter: invert(1) drop-shadow(0px 0px 8px rgba(255, 255, 255, 0.8));
            opacity: 0.85;
        }
    </style>
</head>

<body>

    <div id="juego" id="juego-nivel2">
        <div id="texto-nivel2">MARIO BROS NO USA MACHINE LEARNING</div>

        <div id="escenario">
            <div id="mundo">
                <!-- Tubería 0: Salida alta inicial -->
                <div class="tuberia obstaculo" style="left: 150px; bottom: 50px; width: 90px; height: 180px;"></div>

                <!-- Tubería 1 con Planta 1 (sube/baja) -->
                <div class="tuberia obstaculo" style="left: 500px; bottom: 50px; width: 80px; height: 110px;"></div>
                <div id="planta1"></div>

                <!-- Tubería 2 con Planta 2 desplazadas a left: 1700px -->
<div class="tuberia obstaculo" style="left: 1700px; bottom: 50px; width: 80px; height: 110px;"></div>
<div id="planta2" style="left: 1720px; bottom: 160px;"></div>

                <!-- Proyectil & Hongo -->
                <div id="espina"></div>
                <div id="hongo"></div>

                <!-- Mario -->
                <div id="mario" class="mario-idle" style="left: 171px; bottom: 230px;"></div>
            </div>

            <div id="piso"></div>
        </div>
    </div>

    <script src="script2.js"></script>
</body>

</html>
